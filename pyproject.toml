[tool.ruff]
target-version = "py310"
src = ["src", "scripts"]
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PLC",    # pylint conventions
    "PLE",    # pylint errors
    "PLW",    # pylint warnings
]
ignore = [
    "E501",   # line too long (let formatter handle or ignore for now)
    "E741",   # ambiguous variable name — intentional in math/astro code
    "SIM108", # ternary instead of if-else — often less readable
]

[tool.ruff.lint.isort]
known-first-party = [
    "commands",
    "config",
    "flipperbot",
    "lib",
    "message",
    "models",
    "modules",
    "services",
]

[tool.mypy]
python_version = "3.10"
files = ["src/"]
follow_imports = "skip"
disable_error_code = ["import-untyped"]
check_untyped_defs = true
warn_return_any = true
